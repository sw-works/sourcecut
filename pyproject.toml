[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sourcecut"
version = "0.1.0"
description = "Evidence-backed historical research for film and documentary production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "clickhouse-connect>=0.8,<2",
  "google-adk[mcp]>=1.0,<3",
  "google-cloud-storage>=2.18,<4",
  "google-genai>=1.0,<2",
  "opentelemetry-api>=1.41,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.41,<2",
  "opentelemetry-sdk>=1.41,<2",
  "pydantic>=2.10,<3",
]

[project.scripts]
sourcecut-db-bootstrap = "sourcecut_api.db.bootstrap:main"
sourcecut-load-gutenberg = "sourcecut_api.db.load_gutenberg:main"
sourcecut-mcp-preflight = "sourcecut_api.integrations.clickhouse_mcp:main"
sourcecut-research = "sourcecut_api.agents.research:main"
sourcecut-embed = "sourcecut_api.db.embed:main"
sourcecut-load-terms = "sourcecut_api.db.load_terms:main"
sourcecut-load-entities = "sourcecut_api.db.load_entities:main"
sourcecut-load-route = "sourcecut_api.db.load_route:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/sourcecut_api", "pipelines"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pipelines", "sourcecut_api"]
