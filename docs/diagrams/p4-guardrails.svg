<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Pattern 4 · Guardrails — two independent layers on model-written SQL">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
</defs>
<rect width="1440" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#24292f">Pattern 4 · Guardrails — two independent layers on model-written SQL</text>
<text x="24" y="54" font-size="12" fill="#57606a">The application refuses queries it cannot vouch for; ClickHouse hides unvalidated rows from the MCP role regardless of what SQL asks for.</text>
<path d="M230,225 L259,225 L259,224 L288,224" fill="none" stroke="#24292f" stroke-width="1.5"  marker-end="url(#arrow)"/>
<path d="M420,272 L420,348" fill="none" stroke="#cf222e" stroke-width="1.5"  marker-end="url(#arrow-red)"/>
<rect x="340.6" y="306" width="158.8" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="420" y="318" text-anchor="middle" font-size="10.5" fill="#cf222e">never reaches ClickHouse</text>
<path d="M550,224 L584,224 L584,225 L618,225" fill="none" stroke="#24292f" stroke-width="1.5"  marker-end="url(#arrow)"/>
<rect x="554.2" y="215.5" width="59.6" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/>
<text x="584" y="227.5" text-anchor="middle" font-size="10.5" fill="#24292f">approved</text>
<path d="M820,225 L854,225 L854,224 L888,224" fill="none" stroke="#24292f" stroke-width="1.5"  marker-end="url(#arrow)"/>
<path d="M1130,224 L1159,224 L1159,225 L1188,225" fill="none" stroke="#24292f" stroke-width="1.5"  marker-end="url(#arrow)"/>
<rect x="40" y="190" width="190" height="70" rx="6" fill="#eef2ff" stroke="#4c5fd5" stroke-width="1.5" />
<text x="135" y="223.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">model-written SQL</text>
<text x="135" y="237.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">run_query</text>
<rect x="290" y="176" width="260" height="96" rx="6" fill="#fff0f0" stroke="#cf222e" stroke-width="1.5" />
<text x="420" y="216.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">validate_analytical_query</text>
<text x="420" y="230.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one SELECT · allowlisted tables</text>
<text x="420" y="242.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LIMIT ≤ 200 · FINAL · date bound</text>
<rect x="290" y="350" width="260" height="56" rx="28" fill="#fff0f0" stroke="#cf222e" stroke-width="1.5" />
<text x="420" y="376.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">refused to the model</text>
<text x="420" y="390.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{"error": reason}</text>
<rect x="620" y="190" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="720" y="223.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">mcp-clickhouse</text>
<text x="720" y="237.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">read-only user</text>
<rect x="890" y="176" width="240" height="96" rx="6" fill="#fff0f0" stroke="#cf222e" stroke-width="1.5" />
<text x="1010" y="216.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">ROW POLICY</text>
<text x="1010" y="230.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">trusted = 1 AND</text>
<text x="1010" y="242.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">validation_status = 'valid'</text>
<rect x="1190" y="190" width="210" height="70" rx="35" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5" />
<text x="1295" y="229.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">rows the agent may see</text>
<rect x="24" y="485" width="18" height="12" rx="3" fill="#eef2ff" stroke="#4c5fd5" />
<text x="48" y="495" font-size="11" fill="#57606a">LLM node</text>
<rect x="127.2" y="485" width="18" height="12" rx="3" fill="#fff0f0" stroke="#cf222e" />
<text x="151.2" y="495" font-size="11" fill="#57606a">security service</text>
<rect x="281.6" y="485" width="18" height="12" rx="3" fill="#f3f4f6" stroke="#8c959f" stroke-dasharray="2 3"/>
<text x="305.6" y="495" font-size="11" fill="#57606a">external system</text>
<rect x="429.6" y="485" width="18" height="12" rx="3" fill="#e6f4ea" stroke="#1a7f37" />
<text x="453.6" y="495" font-size="11" fill="#57606a">terminal / outcome</text>
<rect x="596.8" y="485" width="18" height="12" rx="3" fill="#fff0f0" stroke="#cf222e" />
<text x="620.8" y="495" font-size="11" fill="#57606a">blocked / failed</text>
<text x="1416" y="442" text-anchor="end" font-size="10.5" fill="#57606a">The two layers fail differently: the guardrail rejects the query, the policy silently returns fewer rows. Neither depends on prompt adherence.</text>
<text x="1416" y="456" text-anchor="end" font-size="10.5" fill="#57606a">Every restrictive policy ships with a companion USING 1 TO ALL EXCEPT sourcecut_mcp_role, or ClickHouse would hide the table from ingestion too.</text>
<text x="1416" y="470" text-anchor="end" font-size="10.5" fill="#57606a">Runtime views filter trusted rows directly as well, so the boundary holds where the console policies were never applied.</text>
</svg>