<text x="1636" y="708" text-anchor="end" font-size="10.5" fill="#57606a">Three retrieval paths reach the same coverage step; only the first produces validated observations.</text>
<text x="1636" y="722" text-anchor="end" font-size="10.5" fill="#57606a">Agreement, media, and route load concurrently under one asyncio.gather.</text>
<text x="1636" y="736" text-anchor="end" font-size="10.5" fill="#57606a">A gap round writes discovered vocabulary back; a failed write emits memory_write_failed and the board still returns.</text>
