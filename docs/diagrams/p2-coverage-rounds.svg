<text x="24" y="34" font-size="20" font-weight="600" fill="#24292f">Pattern 2 · Goal monitoring — coverage decides whether to research again</text>
<text x="24" y="54" font-size="12" fill="#57606a">Every planned requirement is scored against its own criterion. Unmet ones get exactly one widened round, and what stays unmet is reported.</text>
