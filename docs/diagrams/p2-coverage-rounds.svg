<text x="1396" y="476" text-anchor="end" font-size="10.5" fill="#57606a">A round widens vocabulary only. It never widens the window, never lowers a criterion, and never runs a third time.</text>
<text x="1396" y="490" text-anchor="end" font-size="10.5" fill="#57606a">Gap evidence keeps passage-term: citation ids, so it stays distinguishable from validated observations.</text>
