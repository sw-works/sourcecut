<text x="1636" y="622" text-anchor="end" font-size="10.5" fill="#57606a">Specified in tasks/028-corpus-acquisition.md; not built. The runtime column is what exists today.</text>
<text x="1636" y="636" text-anchor="end" font-size="10.5" fill="#57606a">The model proposes what to look for and never decides rights: eligibility reads one declared field on an already-reviewed repository.</text>
<text x="1636" y="650" text-anchor="end" font-size="10.5" fill="#57606a">Two human gates, both coarse: a repository is admitted once, a release is promoted once. Neither scales with document count.</text>
