<text x="380" y="326.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">route_scope</text>
<text x="380" y="340.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">keyword routing</text>
<rect x="24" y="465" width="18" height="12" rx="3" fill="#f3f4f6" stroke="#8c959f" stroke-dasharray="2 3"/>
<text x="48" y="475" font-size="11" fill="#57606a">external system</text>
<rect x="172" y="465" width="18" height="12" rx="3" fill="#eef2ff" stroke="#4c5fd5" />
<text x="196" y="475" font-size="11" fill="#57606a">LLM node</text>
<rect x="275.2" y="465" width="18" height="12" rx="3" fill="#f6f8fa" stroke="#57606a" />
<text x="299.2" y="475" font-size="11" fill="#57606a">deterministic code</text>
<rect x="442.4" y="465" width="18" height="12" rx="3" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 3"/>
<text x="466.4" y="475" font-size="11" fill="#57606a">store / queue</text>
<rect x="577.5999999999999" y="465" width="18" height="12" rx="3" fill="#e6f4ea" stroke="#1a7f37" />
<text x="601.5999999999999" y="475" font-size="11" fill="#57606a">terminal / outcome</text>
<text x="1216" y="422" text-anchor="end" font-size="10.5" fill="#57606a">Terms reach SQL as literals, so build_plan restricts them to ^[a-z0-9][a-z0-9 '-]{1,39}$ before anything is queried.</text>
<text x="1216" y="436" text-anchor="end" font-size="10.5" fill="#57606a">Planning degrades rather than fails: with no GEMINI_API_KEY the static planner runs the same path offline.</text>
<text x="1216" y="450" text-anchor="end" font-size="10.5" fill="#57606a">A planning call is bounded (SOURCECUT_PLANNER_TIMEOUT_SECONDS, 60s); a call that never returns takes the same fallback.</text>
</svg>