<text x="380" y="178.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">Gemini planner</text>
<text x="380" y="192.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scope_id + requirements</text>
