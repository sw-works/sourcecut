<text x="645" y="192.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">validate before use</text>
<rect x="830" y="150" width="230" height="60" rx="30" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5" />
<text x="945" y="178.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">ResearchPlan</text>
<text x="945" y="192.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">window · terms · criteria</text>
