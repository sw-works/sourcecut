<text x="299.2" y="535" font-size="11" fill="#57606a">deterministic code</text>
<rect x="442.4" y="525" width="18" height="12" rx="3" fill="#fff0f0" stroke="#cf222e" />
<text x="466.4" y="535" font-size="11" fill="#57606a">security service</text>
<rect x="596.8" y="525" width="18" height="12" rx="3" fill="#e6f4ea" stroke="#1a7f37" />
<text x="620.8" y="535" font-size="11" fill="#57606a">terminal / outcome</text>
<text x="1316" y="482" text-anchor="end" font-size="10.5" fill="#57606a">The planner cannot smuggle a historical claim in as a plan, and the auditor cannot fetch evidence to justify one it should have flagged.</text>
<text x="1316" y="496" text-anchor="end" font-size="10.5" fill="#57606a">Separation is wiring, not instruction: an instruction to not look things up is only followed until it is not.</text>
<text x="1316" y="510" text-anchor="end" font-size="10.5" fill="#57606a">Opt in with sourcecut-research --pipeline; the single-agent runtime is still the default.</text>
</svg>