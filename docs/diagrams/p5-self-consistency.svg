<text x="1216" y="462" text-anchor="end" font-size="10.5" fill="#57606a">Runs go out in parallel, so the wall-clock cost is one extraction rather than three.</text>
<text x="1216" y="476" text-anchor="end" font-size="10.5" fill="#57606a">This narrows what reaches span validation; it does not replace it.</text>
<text x="1216" y="490" text-anchor="end" font-size="10.5" fill="#57606a">Not yet wired into corpus ingestion — the precision gain is unmeasured (deferred.md).</text>
